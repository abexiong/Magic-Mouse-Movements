name: Documentation improvement
description: Suggest a correction or clearer integration explanation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link the README, kit guide, example, or section that needs attention.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: Explain the result the documentation should help readers achieve.
    validations:
      required: true
